apiVersion: v1
kind: Secret
metadata:
  name: ai-agent-secret
type: Opaque
stringData:
  # OpenAI
  OPENAI_API_KEY: "sk-proj-xxxxxxx"
  OPENAI_MODEL: "gpt-4o-mini"
  ENABLE_AI: "true"

  # GitHub
  GITHUB_TOKEN: "your_github_token"
  GITHUB_REPO: "owner/repo"
  GITHUB_REPO_URL: "https://api.github.com/repos/owner/repo"

  # Target app
  SFCC_SITE_URL: "https://your-app.com"
  ENV: "dev"

  # Grafana Cloud (k6 remote-write)
  K6_PROMETHEUS_RW_SERVER_URL: "https://prometheus-prod-32-prod-ca-east-0.grafana.net/api/prom/push"
  K6_PROMETHEUS_RW_USERNAME: "xxxxx"
  K6_PROMETHEUS_RW_PASSWORD: "glc_xxxxxx"
  GRAFANA_RW_URL: "https://prometheus-prod-32-prod-ca-east-0.grafana.net/api/prom/push"
  GRAFANA_USERNAME: "xxxxx"
  GRAFANA_URL: "https://xxxxxx.grafana.net"
  GRAFANA_API_KEY: "glc_xxxxx"

  # Slack
  SLACK_WEBHOOK: "https://hooks.slack.com/services/xxxxxx"

  # Jira
  JIRA_URL: "https://xxxxx.atlassian.net"
  JIRA_EMAIL: "your@email.com"
  JIRA_API_TOKEN: "xxxxxxx"
  JIRA_PROJECT_KEY: "PERF"

  # Email
  SMTP_SERVER: "smtp.gmail.com"
  SMTP_USER: "your@gmail.com"
  SMTP_PASS: "app-password"
  EMAIL_TO: "client@email.com"

  # Optional integrations
  SPEEDCURVE_API_KEY: ""
  SPEEDCURVE_SITE_ID: ""
  DATADOG_API_KEY: ""
  MCP_URL: ""
  TOKEN: ""
  LANGCHAIN_TRACING_V2: "false"
  LANGCHAIN_API_KEY: ""
  LANGCHAIN_PROJECT: "ai-performance-agent"
  OPENSPEC_URL: ""
