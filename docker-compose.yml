# =============================================================================
# AI Scripting Agent — Local Docker Stack
#
# Watches GITHUB_REPOS in .env for changes and generates/maintains
# k6, LoadRunner, and Selenium test scripts.
# The target app (testrepo) runs separately — set SFCC_SITE_URL in .env.
#
# Usage:
#   docker-compose up --build
#   docker-compose logs -f test-trigger-agent
#
# Webhook:
#   Test Trigger → POST http://localhost:5001/github-webhook
# =============================================================================

services:

  # ── MCP Tool Server ───────────────────────────────────────────────────────
  mcp-server:
    build: .
    container_name: mcp-server
    command: python mcp_server.py
    ports:
      - "5002:5002"
    env_file: .env
    environment:
      K6_PROMETHEUS_RW_SERVER_URL: ""
      K6_PROMETHEUS_RW_USERNAME: ""
      K6_PROMETHEUS_RW_PASSWORD: ""
    volumes:
      - ./logs:/app/logs
      - ./scripts:/app/scripts
      - ./reports:/app/reports
      - ./checkpoints:/app/checkpoints
      - ./.perf:/app/.perf:ro
      - ./PERF_AGENTS.md:/app/PERF_AGENTS.md:ro
      - ./SCRIPTING_AGENT.md:/app/SCRIPTING_AGENT.md:ro
      - ./PERF_EXEC_AGENT.md:/app/PERF_EXEC_AGENT.md:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Test Trigger Agent ────────────────────────────────────────────────────
  test-trigger-agent:
    build: .
    container_name: test-trigger-agent
    command: python test_trigger_agent.py
    ports:
      - "5001:5001"
    env_file: .env
    environment:
      K6_PROMETHEUS_RW_SERVER_URL: ""
      K6_PROMETHEUS_RW_USERNAME: ""
      K6_PROMETHEUS_RW_PASSWORD: ""
      MCP_URL: http://mcp-server:5002
      CHECKPOINT_DIR: /app/checkpoints
    volumes:
      - ./logs:/app/logs
      - ./scripts:/app/scripts
      - ./reports:/app/reports
      - ./checkpoints:/app/checkpoints
      - ./.perf:/app/.perf:ro
      - ./PERF_AGENTS.md:/app/PERF_AGENTS.md:ro
      - ./SCRIPTING_AGENT.md:/app/SCRIPTING_AGENT.md:ro
      - ./PERF_EXEC_AGENT.md:/app/PERF_EXEC_AGENT.md:ro
    depends_on:
      mcp-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
