# =============================================================================
# AI Scripting Agent — Docker Stack
#
# Scans source code (local directory or GitHub repo) and generates
# k6, LoadRunner, and Selenium test scripts.
#
# LOCAL MODE (no GitHub needed):
#   1. Place your source code in ../testrepo (or set LOCAL_REPO_PATH in .env)
#   2. docker-compose up --build
#   3. Agent auto-scans on startup and generates scripts in ./scripts/
#
# GITHUB MODE (optional):
#   Set GITHUB_REPOS and GITHUB_TOKEN in .env
#   Webhook: POST http://localhost:5001/github-webhook
#
# Trigger rescan:  curl -X POST http://localhost:5001/scan
# Run tests:       curl -X POST http://localhost:5001/run-tests
# =============================================================================

services:

  # ── AI Scripting Agent ──────────────────────────────────────────────────────
  scripting-agent:
    build: .
    container_name: scripting-agent
    command: python test_trigger_agent.py
    ports:
      - "5001:5001"
    env_file: .env
    environment:
      LOCAL_REPO_PATH: /app/target-repo
      REPO_NAME: ${REPO_NAME:-local-repo}
      CHECKPOINT_DIR: /app/checkpoints
      K6_PROMETHEUS_RW_SERVER_URL: ""
      K6_PROMETHEUS_RW_USERNAME: ""
      K6_PROMETHEUS_RW_PASSWORD: ""
    volumes:
      - ./logs:/app/logs
      - ./scripts:/app/scripts
      - ./reports:/app/reports
      - ./checkpoints:/app/checkpoints
      - ./.perf:/app/.perf:ro
      - ./PERF_AGENTS.md:/app/PERF_AGENTS.md:ro
      - ./SCRIPTING_AGENT.md:/app/SCRIPTING_AGENT.md:ro
      - ./PERF_EXEC_AGENT.md:/app/PERF_EXEC_AGENT.md:ro
      # Mount the target repo source code (read-only)
      - ${LOCAL_REPO_PATH:-../testrepo}:/app/target-repo:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
